[DEFAULT]
# This is a minimal config file for Bitcoin Core functional tests
# The tests will use default binary paths if not specified here

# Optional: specify custom binary paths
# exe = /path/to/bitcoind
# cli = /path/to/bitcoin-cli

[environment]
# Build directory - adjust this path to match your build location
BUILDDIR = /Users/rileyponzini-beck/bitcoin/build
# Executable extension (empty on macOS/Linux, .exe on Windows)
EXEEXT = 
# Client bug report URL
CLIENT_BUGREPORT = https://github.com/bitcoin/bitcoin/issues

[components]
# Enable wallet support
ENABLE_WALLET = true 